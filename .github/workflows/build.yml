name: Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the marketplace repo (source of plugin and skill data)
        uses: actions/checkout@v4
        with:
          repository: gmbalaa14/thiran-pattarai
          ref: main
          path: marketplace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run build
