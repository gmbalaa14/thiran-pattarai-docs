name: Deploy Docs

on:
  push:
    branches: [main]
  # Sent by the marketplace repo when plugins/ or .claude-plugin/ change on main.
  repository_dispatch:
    types: [marketplace-updated]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the marketplace repo (source of plugin and skill data)
        uses: actions/checkout@v4
        with:
          repository: gmbalaa14/thiran-pattarai
          ref: main
          path: marketplace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
